# Play Framework settings
play.http.secret.key="changeme" # MUST BE CHANGED IN PRODUCTION

# Enable custom Guice module bindings
play.modules.enabled += "modules.Module"

# Dev server port (avoid collisions with other Play apps)
http.port=9000

# Database configuration
# ~~~~~
# PostgreSQL database
slick.dbs.default.profile="slick.jdbc.PostgresProfile$"
slick.dbs.default.db.driver="org.postgresql.Driver"
slick.dbs.default.db.url="jdbc:postgresql://localhost:5532/auth_platform"
slick.dbs.default.db.user="auth_svc"
slick.dbs.default.db.password="password"
slick.dbs.default.db.logSql=true

# Connection pool settings
slick.dbs.default.db.numThreads=10
slick.dbs.default.db.maxConnections=10

# Play Evolutions
# ~~~~~
# Disabled - using manual schema management
play.evolutions.enabled=false
play.evolutions.db.default.enabled=false

# Pekko configuration
pekko {
  actor {
    provider = "local"
  }
}
play.filters.csrf.bypassRoutes += "^/api/register$"

